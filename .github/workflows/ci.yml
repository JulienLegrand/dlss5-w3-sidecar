name: CI

# The project's central claim is that no code is loaded into Wow.exe, and that
# the claim is checked rather than asserted. This workflow is where that check
# runs for anyone who did not build locally.
#
# The NVIDIA Optical Flow SDK is a manual download and is never vendored (I11),
# so CI builds without it: NvofaFlow reports Available() false and the two
# optical-flow device tests skip. Nothing else changes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pefile is what reads the import directory; the post-build invariant
      # check fails the build without it.
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check pefile pytest

      - name: Test the invariant checker itself
        run: python -m pytest ci/test_check_imports.py -v

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER=cl

      # The invariant check runs as a post-build step on every executable, so a
      # forbidden import fails this step rather than shipping.
      - name: Build
        run: cmake --build build --config Release

      # [device] tests need an NVIDIA GPU and are deliberately excluded: the
      # runners have none, and a skipped GPU test must not read as a pass.
      - name: Unit tests
        run: .\build\tests\sidecar_tests.exe "[unit]"

      # Belt and braces: assert the invariant against the finished binaries
      # too, independently of the build having run its post-build step.
      - name: Re-check binaries against the safety invariants
        run: |
          python ci/check_imports.py build\wowsidecar.exe build\wowsidecar-manager.exe build\testpattern.exe

      - name: Upload compiled executables
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-windows-release
          if-no-files-found: error
          path: |
            build/wowsidecar.exe
            build/wowsidecar-manager.exe
            build/testpattern.exe
            build/tests/sidecar_tests.exe
